<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width" />
    <title> NoClanker </title>
    <link rel="stylesheet" href="style.css" />
  </head>


<body>
  <main class="container">
    <div class="card">
      <h2>
        <span id="website-name">This site</span> has been blocked by NoClanker
      </h2>
      <p>"<span id="quotes"></span>"</p>
    </div>
  </main>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const blockedUrl = urlParams.get('url') || window.location.hostname;
    
    if (blockedUrl) {
      document.getElementById("website-name").innerText = blockedUrl;
    }
    const quotes = ["Lack of direction, not lack of time, is the problem. We all have 24-hour days.", "Stay focused on your mission, remain steadfast in your pursuit of excellence, and always do the right thing."];
    let shuffle = Math.floor(Math.random() * quotes.length);
    let randomizedquote = quotes[shuffle];
    document.getElementById("quotes").innerText = randomizedquote;
  </script>
</body>
</html>
